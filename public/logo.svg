<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="nexis-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66FCF1" />
      <stop offset="50%" stop-color="#45A29E" />
      <stop offset="100%" stop-color="#0077FF" />
    </linearGradient>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Node N Emblem -->
  <g transform="translate(100, 30)">
    <!-- Connective outer lines -->
    <path d="M 50 170 L 50 40 L 250 200 L 250 40" fill="none" stroke="url(#nexis-cyan-grad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyan-glow)" />
    <path d="M 50 170 L 120 110 L 250 200" fill="none" stroke="#66FCF1" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    
    <!-- Glowing Node Vertices -->
    <circle cx="50" cy="40" r="14" fill="#66FCF1" filter="url(#cyan-glow)" />
    <circle cx="50" cy="170" r="14" fill="#66FCF1" filter="url(#cyan-glow)" />
    <circle cx="120" cy="110" r="12" fill="#45A29E" filter="url(#cyan-glow)" />
    <circle cx="200" cy="150" r="12" fill="#66FCF1" filter="url(#cyan-glow)" />
    <circle cx="250" cy="200" r="14" fill="#0088FF" filter="url(#cyan-glow)" />
    <circle cx="250" cy="40" r="14" fill="#66FCF1" filter="url(#cyan-glow)" />
  </g>

  <!-- Typography -->
  <g transform="translate(250, 330)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="58" letter-spacing="8" fill="#FFFFFF">
      NE<tspan fill="#66FCF1" filter="url(#cyan-glow)">X</tspan>IS
    </text>
  </g>

  <!-- Subtitle ACADEMY with accent lines -->
  <g transform="translate(250, 390)" text-anchor="middle">
    <line x1="-160" y1="-8" x2="-100" y2="-8" stroke="#45A29E" stroke-width="2" opacity="0.6" />
    <text font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="24" letter-spacing="12" fill="#66FCF1">
      ACADEMY
    </text>
    <line x1="100" y1="-8" x2="160" y2="-8" stroke="#45A29E" stroke-width="2" opacity="0.6" />
  </g>
</svg>
