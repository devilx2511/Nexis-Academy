<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0C10" />
      <stop offset="50%" stop-color="#1F2833" />
      <stop offset="100%" stop-color="#0B0C10" />
    </linearGradient>
    <linearGradient id="cyan-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66FCF1" />
      <stop offset="100%" stop-color="#45A29E" />
    </linearGradient>
    <filter id="card-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.1" stroke="#66FCF1" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Glowing Corner Accents -->
  <circle cx="100" cy="100" r="180" fill="#66FCF1" opacity="0.08" filter="url(#card-glow)" />
  <circle cx="1100" cy="500" r="220" fill="#45A29E" opacity="0.08" filter="url(#card-glow)" />

  <!-- Main Card Container -->
  <rect x="80" y="60" width="1040" height="510" rx="30" fill="#1F2833" fill-opacity="0.7" stroke="#66FCF1" stroke-width="2" stroke-opacity="0.3" filter="url(#card-glow)" />

  <!-- Badge -->
  <rect x="130" y="110" width="360" height="40" rx="20" fill="#66FCF1" fill-opacity="0.1" stroke="#66FCF1" stroke-width="1.5" />
  <text x="310" y="136" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="14" fill="#66FCF1" text-anchor="middle" letter-spacing="3">
    TECH-DRIVEN TUITION &amp; COACHING
  </text>

  <!-- Heading -->
  <text x="130" y="210" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="52" fill="#FFFFFF" letter-spacing="1">
    NEXIS ACADEMY
  </text>

  <!-- Tagline -->
  <text x="130" y="270" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="26" fill="#66FCF1">
    Unlock Your Academic Potential (Class 6 - 12)
  </text>

  <!-- Description -->
  <text x="130" y="325" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="18" fill="#C5C6C7">
    Personalized Science &amp; Mathematics Coaching with 3D Visual Learning,
  </text>
  <text x="130" y="355" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="18" fill="#C5C6C7">
    1:10 Small Batch Ratios, Board Prep Sprints, and JEE/NEET Foundations.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(130, 410)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="44" rx="12" fill="#0B0C10" stroke="#66FCF1" stroke-width="1" stroke-opacity="0.4" />
    <text x="110" y="28" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF" text-anchor="middle">
      ✓ Max 10-12 Students
    </text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="220" height="44" rx="12" fill="#0B0C10" stroke="#66FCF1" stroke-width="1" stroke-opacity="0.4" />
    <text x="350" y="28" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF" text-anchor="middle">
      ✓ 3D Spatial Science
    </text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="220" height="44" rx="12" fill="#0B0C10" stroke="#66FCF1" stroke-width="1" stroke-opacity="0.4" />
    <text x="590" y="28" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF" text-anchor="middle">
      ✓ Free Demo Classes
    </text>
  </g>

  <!-- URL Footer -->
  <text x="130" y="520" font-family="'Inter', monospace" font-weight="700" font-size="16" fill="#45A29E" letter-spacing="2">
    HTTPS://NEXISACADEMY.COM
  </text>

  <!-- Right Logo Graphic -->
  <g transform="translate(860, 160) scale(0.65)">
    <path d="M 50 170 L 50 40 L 250 200 L 250 40" fill="none" stroke="url(#cyan-glow-grad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#card-glow)" />
    <path d="M 50 170 L 120 110 L 250 200" fill="none" stroke="#66FCF1" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    <circle cx="50" cy="40" r="18" fill="#66FCF1" />
    <circle cx="50" cy="170" r="18" fill="#66FCF1" />
    <circle cx="120" cy="110" r="16" fill="#45A29E" />
    <circle cx="250" cy="200" r="18" fill="#0088FF" />
    <circle cx="250" cy="40" r="18" fill="#66FCF1" />
  </g>
</svg>
